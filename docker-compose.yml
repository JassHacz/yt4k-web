services:
  web:
    build: .
    container_name: yt4k-web
    restart: unless-stopped
    environment:
      # YouTube "sign in to confirm you're not a bot" error vandha:
      # VPS-la browser install pannitu itha enable pannu (e.g. "chrome", "firefox")
      # YTDLP_COOKIES_BROWSER: "chrome"
      # illa residential proxy files attach pannitu:
      # PROXY env pidichurukom
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./downloads:/app/downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
