<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded square gradient bg -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#g)"/>
  <!-- glossy sheen -->
  <rect x="8" y="8" width="240" height="130" rx="56" fill="url(#sh)"/>

  <!-- play button -->
  <circle cx="112" cy="118" r="52" fill="#ffffff" opacity=".14"/>
  <path d="M 92 82 L 92 154 L 152 118 Z" fill="#ffffff"
        transform="translate(-6 0)"
        style="filter: drop-shadow(0 6px 14px rgba(0,0,0,.25))"/>

  <!-- 4K badge -->
  <rect x="150" y="176" width="70" height="40" rx="12" fill="#ffffff"/>
  <text x="185" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="26"
        font-weight="800" text-anchor="middle" fill="#5b6ee8">4K</text>
</svg>
